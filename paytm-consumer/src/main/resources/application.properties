spring.application.name=paytm-consumer
server.port=9292
spring.kafka.consumer.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=Payment-consumer-group


spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# IllegalArgumentException -> '' is not trusted package then need below
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ltimindtree.dto